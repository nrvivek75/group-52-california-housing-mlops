name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feat/setup ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: california-housing-mlops
  DOCKER_TAG: latest

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest pytest-cov
    
    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check with black
      run: |
        black --check --diff src/
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/setup'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push with version tag
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ **CI/CD Pipeline Completed Successfully!**\n\n🚀 **Docker Image Built and Pushed:**\n- Image: `${{ secrets.DOCKER_USERNAME }}/california-housing-mlops:latest`\n- Version: `${{ secrets.DOCKER_USERNAME }}/california-housing-mlops:${{ github.sha }}`\n\n📋 **Next Steps for Local Testing:**\n```bash\n# Pull the latest image\ndocker pull ${{ secrets.DOCKER_USERNAME }}/california-housing-mlops:latest\n\n# Run the container locally\ndocker run -d \\\n  --name california-housing-api \\\n  -p 8001:8001 \\\n  -v $(pwd)/logs:/app/logs \\\n  -v $(pwd)/mlruns:/app/mlruns \\\n  ${{ secrets.DOCKER_USERNAME }}/california-housing-mlops:latest\n\n# Or use docker-compose\ndocker-compose up -d\n```\n\n🔍 **Access Points:**\n- API: http://localhost:8001\n- MLflow UI: http://localhost:5002\n- Prometheus: http://localhost:9090\n- Grafana: http://localhost:3000 (admin/admin)'
          }) 
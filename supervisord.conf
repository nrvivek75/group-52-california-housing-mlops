[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:startup]
command=/app/scripts/startup.sh
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/supervisor/startup.out.log
stderr_logfile=/var/log/supervisor/startup.err.log
environment=PYTHONPATH="/app"
priority=100

[program:api]
command=python src/api.py
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/api.out.log
stderr_logfile=/var/log/supervisor/api.err.log
environment=PYTHONPATH="/app"
priority=200

[program:mlflow]
command=mlflow ui --backend-store-uri file:./mlruns --default-artifact-root ./mlruns --host 0.0.0.0 --port 5002
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/mlflow.out.log
stderr_logfile=/var/log/supervisor/mlflow.err.log
environment=PYTHONPATH="/app"
priority=300

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/app/prometheus.yml --web.listen-address=:9090
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/prometheus.out.log
stderr_logfile=/var/log/supervisor/prometheus.err.log
priority=400

[program:grafana]
command=/usr/local/grafana/bin/grafana-server --config=/app/grafana/conf/custom.ini --homepath=/usr/local/grafana
directory=/usr/local/grafana
autostart=true
autorestart=true
startsecs=15
stdout_logfile=/var/log/supervisor/grafana.out.log
stderr_logfile=/var/log/supervisor/grafana.err.log
environment=GF_SECURITY_ADMIN_PASSWORD="admin",GF_USERS_ALLOW_SIGN_UP="false",GF_SERVER_HTTP_PORT="3000",GF_INSTALL_PLUGINS="grafana-clock-panel,grafana-simple-json-datasource"
priority=500

[group:mlops]
programs=startup,api,mlflow,prometheus,grafana
priority=999 
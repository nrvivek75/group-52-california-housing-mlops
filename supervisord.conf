[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:api]
command=python src/api.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile=/var/log/supervisor/api.out.log
environment=PYTHONPATH="/app"

[program:mlflow]
command=mlflow ui --backend-store-uri file:./mlruns --default-artifact-root ./mlruns --host 0.0.0.0 --port 5002
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/mlflow.err.log
stdout_logfile=/var/log/supervisor/mlflow.out.log
environment=PYTHONPATH="/app"

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/app/prometheus.yml --web.listen-address=:9090
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/prometheus.err.log
stdout_logfile=/var/log/supervisor/prometheus.out.log

[program:grafana]
command=/usr/local/grafana/bin/grafana-server --config=/usr/local/grafana/conf/defaults.ini --homepath=/usr/local/grafana
directory=/usr/local/grafana
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/grafana.err.log
stdout_logfile=/var/log/supervisor/grafana.out.log
environment=GF_SECURITY_ADMIN_PASSWORD="admin",GF_USERS_ALLOW_SIGN_UP="false",GF_SERVER_HTTP_PORT="3000"

[group:mlops]
programs=api,mlflow,prometheus,grafana
priority=999 